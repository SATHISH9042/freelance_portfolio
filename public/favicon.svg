<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Black rounded container matching home page SR badge -->
  <rect width="64" height="64" rx="16" fill="#000000" />
  
  <!-- Subtle border for high contrast on both light and dark browser tabs -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  
  <!-- Bold SR Typography matching home page brand -->
  <text 
    x="32" 
    y="33.5" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Syne', 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="28" 
    letter-spacing="0.5px">SR</text>
</svg>
